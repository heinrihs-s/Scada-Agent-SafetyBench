name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: tests
        run: python -m pytest
      - name: offline demo
        run: scada-safetybench demo

  # The example reports are part of the published artifact. Regenerating them
  # from the committed scenarios, responses and gates must give the same bytes,
  # so a gate change cannot silently leave the published numbers behind.
  reports:
    name: example reports reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: regenerate
        run: |
          scada-safetybench demo --format markdown --output reports/demo-report.md
          scada-safetybench demo --format json --output reports/demo-report.json
      - name: compare with the committed reports
        run: |
          git diff --exit-code reports/ \
            || (echo "::error::reports/ is out of date; regenerate it with scada-safetybench demo" && exit 1)
