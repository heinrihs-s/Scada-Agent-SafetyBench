[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scada-agent-safetybench"
version = "0.1.0"
description = "Simulation-only SCADA/IEC-104 agent safety benchmark with deterministic policy gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Heinrihs Skrodelis" }
]
keywords = ["scada", "ics", "iec-104", "ai-safety", "llm", "benchmark", "ot-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Scientific/Engineering"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/heinrihs-s/Scada-Agent-SafetyBench"
Taxonomy = "https://github.com/heinrihs-s/Scada-Agent-SafetyBench/blob/main/docs/TAXONOMY.md"
Issues = "https://github.com/heinrihs-s/Scada-Agent-SafetyBench/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scada-safetybench = "scada_agent_safetybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

